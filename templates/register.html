<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06111d"><title>SKYLINE — Créer une compagnie</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-body"><main class="auth-card wide"><div class="auth-brand"><span>✈</span><div><b>SKYLINE</b><small>AIRWAYS · IMMERSIVE WORLD</small></div></div><h1>Créer ta compagnie</h1><p>Le hub n’est plus imposé : après le compte, tu choisiras ton premier aéroport parmi le catalogue mondial.</p>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post"><div class="form-two"><label>Nom de la compagnie<input name="company_name" maxlength="120" placeholder="Ex. Horizon Airways" required></label><label>Pseudo<input name="username" maxlength="80" required></label></div><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Mot de passe<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><button class="primary" type="submit">Créer la compagnie</button></form><div class="auth-foot">Déjà un compte ? <a href="/login">Se connecter</a></div></main></body></html>
