<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKYLINE — Créer une compagnie</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-brand"><div class="brand-plane">✈</div><h1>SKYLINE</h1><p>AIRWAYS</p><span>Commence à CDG avec une porte, aucun avion et 90 M€.</span></section><form class="auth-card" method="post" action="/register"><h2>Créer ta compagnie</h2><p class="muted">La sauvegarde sera liée à ton compte.</p>{% if error %}<div class="auth-error">{{error}}</div>{% endif %}<label>Nom de la compagnie<input type="text" name="company_name" required maxlength="120" placeholder="Ex. Hexa Air"></label><label>Pseudo<input type="text" name="username" required maxlength="80" autocomplete="username"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Mot de passe<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="primary" type="submit">Créer la compagnie</button><p class="auth-switch">Déjà inscrit ? <a href="/login">Connexion</a></p></form></main></body></html>
