<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKYLINE — Connexion</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-body"><main class="auth-shell"><section class="auth-brand"><div class="brand-plane">✈</div><h1>SKYLINE</h1><p>AIRWAYS</p><span>Ton monde aérien, ta compagnie.</span></section><form class="auth-card" method="post" action="/login"><h2>Connexion</h2><p class="muted">Retrouve ta compagnie et sa progression.</p>{% if error %}<div class="auth-error">{{error}}</div>{% endif %}<label>Email<input type="email" name="email" required autocomplete="email"></label><label>Mot de passe<input type="password" name="password" required autocomplete="current-password"></label><button class="primary" type="submit">Se connecter</button><p class="auth-switch">Pas encore de compagnie ? <a href="/register">Créer un compte</a></p></form></main></body></html>
